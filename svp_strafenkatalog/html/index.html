<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Sunset Valley+ · Strafenkatalog</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app" class="hidden">
    <header class="hdr">
      <div class="hdr-left">
        <div class="emblem">
          <svg viewBox="0 0 48 52" aria-hidden="true">
            <path d="M24 2 L45 9 V25 C45 38 36 46 24 50 C12 46 3 38 3 25 V9 Z" fill="var(--accent)"/>
            <path d="M24 6 L41 12 V25 C41 35.5 33.5 42.5 24 46 C14.5 42.5 7 35.5 7 25 V12 Z" fill="none" stroke="rgba(0,0,0,.35)" stroke-width="1.5"/>
          </svg>
          <span id="emblemText">CHP</span>
        </div>
        <div class="hdr-titles">
          <div class="hdr-name" id="agencyName">California Highway Patrol</div>
          <div class="hdr-sub"><span id="serverName">Sunset Valley+</span> • Strafenkatalog</div>
        </div>
      </div>
      <div class="hdr-right">
        <div class="seg seg-agency" id="agencySeg"></div>
        <div class="clock" id="clock">00:00</div>
        <button class="close" id="closeBtn" title="Schließen (ESC)">✕</button>
      </div>
    </header>

    <main class="main">
      <nav class="sidebar">
        <div class="side-title">Kategorien</div>
        <div class="cats" id="cats"></div>
      </nav>

      <section class="catalog">
        <div class="toolbar">
          <label class="search">
            <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M13 13 L17.5 17.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            <input id="search" type="text" placeholder="Suchen…" autocomplete="off" spellcheck="false">
            <kbd>/</kbd>
          </label>
          <div class="seg seg-cls" id="clsSeg">
            <button data-cls="" class="active">Alle</button>
            <button data-cls="I"><i class="dot dot-I"></i>Infraction</button>
            <button data-cls="M"><i class="dot dot-M"></i>Misdemeanor</button>
            <button data-cls="F"><i class="dot dot-F"></i>Felony</button>
          </div>
        </div>
        <div class="cols">
          <span>Paragraph</span><span>Tatbestand</span><span class="r">Geldstrafe</span><span class="r">Haft</span><span class="r">Punkte</span><span></span>
        </div>
        <div class="list" id="list"></div>
        <div class="list-foot" id="listFoot"></div>
      </section>

      <aside class="notice">
        <div class="notice-head">
          <div>
            <div class="nh-title">Strafbescheid</div>
            <div class="nh-no" id="ticketNo">Nr. SV-000000</div>
          </div>
          <div class="nh-date">
            <div id="nDate">01.01.2026</div>
            <div id="nTime">00:00 Uhr</div>
          </div>
        </div>

        <div class="fields">
          <label class="field">
            <span>Person</span>
            <input id="personName" type="text" placeholder="Name" autocomplete="off" spellcheck="false">
          </label>
          <label class="field">
            <span>Kennzeichen</span>
            <input id="plate" class="mono up" type="text" placeholder="8SVP123" maxlength="10" autocomplete="off" spellcheck="false">
          </label>
        </div>

        <div class="selected" id="selected"></div>

        <div class="stats">
          <div class="stat stat-fine">
            <span>Geldstrafe</span>
            <strong id="tFine">$0</strong>
          </div>
          <div class="stat">
            <span>Haft</span>
            <strong><em id="tJail">0</em> HE <b id="tMax" class="cap hidden" title="Maximale Haftzeit erreicht">⚠</b></strong>
          </div>
          <div class="stat">
            <span>Punkte</span>
            <strong id="tPoints">0</strong>
          </div>
        </div>

        <div class="license hidden" id="tLicense">🪪 Führerscheinentzug empfohlen</div>

        <label class="field">
          <span>Bemerkungen</span>
          <textarea id="notes" placeholder="Sachverhalt, Ort, Zeugen…" spellcheck="false"></textarea>
        </label>

        <div class="actions">
          <button class="btn-copy" id="copyBtn">📋 Strafbescheid kopieren</button>
          <button class="btn-trash" id="resetBtn" title="Zurücksetzen">🗑</button>
        </div>
      </aside>
    </main>
  </div>

  <div id="toast" class="toast"></div>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
