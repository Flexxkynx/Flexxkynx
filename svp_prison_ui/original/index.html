<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Prison Timer HUD - Minimalistic Style (ss-hud) -->
    <div id="prison-hud-minimal" class="hidden">
        <div class="w-full text-center">
            <div class="flex justify-between items-baseline mb-1">
                <span class="text-[8px] uppercase tracking-[0.3em] opacity-30">Prison</span>
                <span class="text-sm font-extralight tracking-widest" id="time-display-minimal">00:00</span>
            </div>
            <div class="line-bg"><div class="line-fill" id="time-bar-minimal"></div></div>
        </div>
    </div>

    <!-- Prison Timer HUD - Alternative Style (Bottom, Larger) -->
    <div id="prison-hud-alternative" class="hidden">
        <div class="w-full text-center">
            <div class="time-value-alt" id="time-display-alt">00:00</div>
            <div class="line-bg-alt"><div class="line-fill-alt" id="time-bar-alt"></div></div>
        </div>
    </div>

    <!-- Prisoner Management UI -->
    <div id="prisoner-management" class="hidden">
        <div class="management-container">
            <div class="management-header">
                <h1 id="ui-title">Prison Management</h1>
                <button class="close-btn" onclick="closeManagementUI()">✕</button>
            </div>

            <!-- Tab Navigation -->
            <div class="tab-container">
                <button class="tab-btn active" data-tab="current" id="tab-current">Current Prisoners</button>
                <button class="tab-btn" data-tab="history" id="tab-history">Release History</button>
            </div>

            <!-- Current Prisoners Tab -->
            <div class="tab-content active" id="content-current">
                <div class="search-bar">
                    <input type="text" id="search-current" placeholder="Search prisoners...">
                </div>
                <div class="prisoner-list" id="current-prisoners">
                    <div class="no-data" id="no-current">No prisoners currently jailed</div>
                </div>
            </div>

            <!-- Release History Tab -->
            <div class="tab-content" id="content-history">
                <div class="search-bar">
                    <input type="text" id="search-history" placeholder="Search history...">
                </div>
                <div class="prisoner-list" id="history-list">
                    <div class="no-data" id="no-history">No release history</div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
