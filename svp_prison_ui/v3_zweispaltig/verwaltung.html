<!doctype html>
<html lang="de">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <!-- Verwaltung -->
        <div id="prisoner-management">
            <div class="panel">
                <aside class="side">
                    <div class="side-head">
                        <h1 id="ui-title">Gefängnisverwaltung</h1>
                    </div>
                    <div class="tabs">
                        <button class="tab-btn active" data-tab="current">
                            <span id="tab-current">Inhaftiert</span><i id="count-current">4</i>
                        </button>
                        <button class="tab-btn" data-tab="history">
                            <span id="tab-history">Entlassungen</span><i id="count-history">4</i>
                        </button>
                    </div>
                    <div class="search">
                        <input type="text" id="search" placeholder="Name, Grund oder Beamter …" autocomplete="off" spellcheck="false" />
                    </div>

                    <div class="tab-content active" id="content-current">
                        <div class="prisoner-list" id="current-prisoners">
                            <button class="item selected">
                                <div class="item-top">
                                    <span class="item-name">Marco Vitale</span>
                                    <span class="item-time">1 h 24 min</span>
                                </div>
                                <div class="item-sub">Bewaffneter Raubüberfall auf Fleeca Bank, Flucht vor der Polizei</div>
                                <div class="item-bar"><span style="width: 30%"></span></div></button
                            ><button class="item">
                                <div class="item-top">
                                    <span class="item-name">Jenny Okafor</span>
                                    <span class="item-time">12 min</span>
                                </div>
                                <div class="item-sub">Drogenbesitz (Klasse B)</div>
                                <div class="item-bar"><span style="width: 60%"></span></div></button
                            ><button class="item ending">
                                <div class="item-top">
                                    <span class="item-name">Dmitri Volkov</span>
                                    <span class="item-time">3 min</span>
                                </div>
                                <div class="item-sub">Körperverletzung, Widerstand gegen Vollstreckungsbeamte</div>
                                <div class="item-bar"><span style="width: 93%"></span></div></button
                            ><button class="item">
                                <div class="item-top">
                                    <span class="item-name">Tobias "Tobi" Reuter</span>
                                    <span class="item-time">3 h 10 min</span>
                                </div>
                                <div class="item-sub">Fahren ohne Fahrerlaubnis, Unfallflucht</div>
                                <div class="item-bar"><span style="width: 21%"></span></div>
                            </button>
                        </div>
                    </div>
                    <div class="tab-content" id="content-history">
                        <div class="prisoner-list" id="history-list"></div>
                    </div>

                    <div class="side-foot">
                        <kbd>↑</kbd><kbd>↓</kbd> <span id="hint-nav">auswählen</span> <kbd>Esc</kbd> <span id="hint-close">schließen</span>
                    </div>
                </aside>

                <main class="detail" id="detail">
                    <span class="status">In Haft</span>
                    <h2 class="detail-name">Marco Vitale</h2>
                    <div class="big">
                        <div class="big-label">Restzeit</div>
                        <div class="big-value">1 h 24 min</div>
                        <div class="big-bar"><span style="width: 30%"></span></div>
                        <div class="big-meta">
                            <span>36 min verbüßt</span>
                            <span>Strafe 2 h</span>
                        </div>
                    </div>
                    <dl class="facts">
                        <div class="fact">
                            <dt>Eingesperrt von</dt>
                            <dd>Sgt. L. Hoffmann</dd>
                        </div>
                        <div class="fact">
                            <dt>Haftbeginn</dt>
                            <dd>vor 36 Min. <span class="dim">· 07.10.2026, 16:39</span></dd>
                        </div>
                    </dl>
                    <div class="reason">
                        <h3>Grund</h3>
                        <p>Bewaffneter Raubüberfall auf Fleeca Bank, Flucht vor der Polizei</p>
                    </div>
                    <div class="actions"><button class="release-btn">Entlassen</button></div>
                </main>

                <button class="close-btn" aria-label="Schließen">
                    <svg width="14" height="14" viewBox="0 0 14 14">
                        <path d="M1 1l12 12M13 1L1 13" stroke="currentColor" stroke-width="1.6"></path>
                    </svg>
                </button>
            </div>
        </div>
    </body>
</html>
