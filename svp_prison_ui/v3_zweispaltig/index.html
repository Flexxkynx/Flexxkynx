<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- HUD oben (useSHud = true) -->
    <div id="prison-hud-minimal" class="hidden">
        <div class="hud-row">
            <span class="hud-label">Haft</span>
            <span class="hud-time" id="time-display-minimal">00:00</span>
        </div>
        <div class="hud-track"><div class="hud-fill" id="time-bar-minimal"></div></div>
    </div>

    <!-- HUD unten (useSHud = false) -->
    <div id="prison-hud-alternative" class="hidden">
        <div class="alt-body">
            <div class="alt-side">
                <span class="alt-label" id="alt-label">Restzeit</span>
                <span class="alt-percent" id="alt-percent">0 %</span>
            </div>
            <div class="alt-time" id="time-display-alt">00:00</div>
        </div>
        <div class="alt-track"><div class="alt-fill" id="time-bar-alt"></div></div>
    </div>

    <!-- Verwaltung -->
    <div id="prisoner-management" class="hidden">
        <div class="panel">
            <aside class="side">
                <div class="side-head">
                    <h1 id="ui-title">Gefängnisverwaltung</h1>
                </div>
                <div class="tabs">
                    <button class="tab-btn active" data-tab="current"><span id="tab-current">Inhaftiert</span><i id="count-current">0</i></button>
                    <button class="tab-btn" data-tab="history"><span id="tab-history">Entlassungen</span><i id="count-history">0</i></button>
                </div>
                <div class="search">
                    <input type="text" id="search" placeholder="Suchen …" autocomplete="off" spellcheck="false">
                </div>

                <div class="tab-content active" id="content-current">
                    <div class="prisoner-list" id="current-prisoners"></div>
                </div>
                <div class="tab-content" id="content-history">
                    <div class="prisoner-list" id="history-list"></div>
                </div>

                <div class="side-foot"><kbd>↑</kbd><kbd>↓</kbd> <span id="hint-nav">auswählen</span> <kbd>Esc</kbd> <span id="hint-close">schließen</span></div>
            </aside>

            <main class="detail" id="detail"></main>

            <button class="close-btn" onclick="closeManagementUI()" aria-label="Schließen">
                <svg width="14" height="14" viewBox="0 0 14 14"><path d="M1 1l12 12M13 1L1 13" stroke="currentColor" stroke-width="1.6"/></svg>
            </button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
