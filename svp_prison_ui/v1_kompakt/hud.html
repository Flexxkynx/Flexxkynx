<!doctype html>
<html lang="de">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="style.css" />
        <style>
            html {
                background: #3b4046;
            }
        </style>
    </head>
    <body>
        <!-- HUD oben -->
        <div id="prison-hud-minimal">
            <div class="hud-row">
                <span class="hud-label" id="hud-label-minimal">Haft</span>
                <span class="hud-time" id="time-display-minimal">12:34</span>
            </div>
            <div class="hud-track"><div class="hud-fill" id="time-bar-minimal" style="width: 37%"></div></div>
        </div>

        <!-- HUD unten -->
        <div id="prison-hud-alternative">
            <div class="alt-time" id="time-display-alt">12:34</div>
            <div class="alt-track"><div class="alt-fill" id="time-bar-alt" style="width: 37%"></div></div>
            <div class="alt-meta">
                <span id="hud-label-alt">Restzeit</span>
                <span id="alt-percent">37 % verbüßt</span>
            </div>
        </div>
    </body>
</html>
