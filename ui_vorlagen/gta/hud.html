<!DOCTYPE html>
<html lang="de" class="preview">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HUD</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Kleiner Timer oben -->
    <div class="hud-timer">
        <div class="hud-timer-row">
            <span class="hud-label">Timer</span>
            <span class="hud-time">12:34</span>
        </div>
        <div class="hud-track"><span style="width: 37%"></span></div>
    </div>

    <!-- Benachrichtigungen rechts -->
    <div class="toasts">
        <div class="toast toast-ok">
            <span class="toast-title">Gespeichert</span>
            <span class="toast-text">Deine Änderungen wurden übernommen.</span>
        </div>
        <div class="toast toast-warn">
            <span class="toast-title">Achtung</span>
            <span class="toast-text">Tank fast leer.</span>
        </div>
        <div class="toast toast-err">
            <span class="toast-title">Fehlgeschlagen</span>
            <span class="toast-text">Nicht genug Geld.</span>
        </div>
        <div class="toast">
            <span class="toast-title">Info</span>
            <span class="toast-text">Neue Nachricht von Jenny Okafor.</span>
        </div>
    </div>

    <!-- Statusleiste links unten -->
    <div class="hud-status">
        <div class="meter"><span class="meter-label">Leben</span><div class="meter-track"><span style="width: 82%"></span></div></div>
        <div class="meter"><span class="meter-label">Rüstung</span><div class="meter-track"><span style="width: 40%"></span></div></div>
        <div class="meter"><span class="meter-label">Hunger</span><div class="meter-track"><span style="width: 65%"></span></div></div>
        <div class="meter is-low"><span class="meter-label">Durst</span><div class="meter-track"><span style="width: 14%"></span></div></div>
    </div>

    <!-- Interaktion Mitte -->
    <div class="prompt"><kbd>E</kbd><span>Tür öffnen</span></div>

    <!-- Großer Timer / Fortschritt unten -->
    <div class="hud-big">
        <div class="hud-big-body">
            <div class="hud-big-side">
                <span class="hud-label">Reparatur</span>
                <span class="hud-big-sub">64 %</span>
            </div>
            <div class="hud-big-value">00:18</div>
        </div>
        <div class="hud-track hud-track-big"><span style="width: 64%"></span></div>
    </div>
</body>
</html>
