<title>ETS2 Streckenrechner</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: sign-blue header band, then a working panel (route form + result sheet) beside a pannable map of the game world. */
:root {
  --bg: #e9edf2;
  --panel: #ffffff;
  --panel-2: #f4f6f9;
  --ink: #111c2a;
  --muted: #586678;
  --line: #d3dae3;
  --accent: #e98a0b;
  --accent-ink: #9a5200;
  --accent-soft: #fdf0dc;
  --sign-blue: #1b4d9b;
  --sign-blue-ink: #ffffff;
  --sign-green: #15774a;
  --danger: #b4232a;
  --map-water: #cddbea;
  --map-land: #f6f7f9;
  --map-border: #c2cbd6;
  --map-road: #8d9aab;
  --map-ferry: #4f7fb3;
  --map-city: #2c3a4c;
  --map-off: #c4ccd6;
  --halo: #f6f7f9;
  --font-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --font-body: "Barlow", "Segoe UI", system-ui, -apple-system, sans-serif;
  --radius: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c131c; --panel: #131e2b; --panel-2: #182536; --ink: #e6edf5; --muted: #95a3b6; --line: #253548;
    --accent: #ffa733; --accent-ink: #ffc46e; --accent-soft: #33260f;
    --sign-blue: #22599f; --sign-blue-ink: #ffffff; --sign-green: #1e8a56; --danger: #ff6b6b;
    --map-water: #0b1826; --map-land: #182638; --map-border: #2c3e55; --map-road: #4f6580; --map-ferry: #5f8fc4;
    --map-city: #c3cfdd; --map-off: #34465d; --halo: #182638;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c131c; --panel: #131e2b; --panel-2: #182536; --ink: #e6edf5; --muted: #95a3b6; --line: #253548;
  --accent: #ffa733; --accent-ink: #ffc46e; --accent-soft: #33260f;
  --sign-blue: #22599f; --sign-blue-ink: #ffffff; --sign-green: #1e8a56; --danger: #ff6b6b;
  --map-water: #0b1826; --map-land: #182638; --map-border: #2c3e55; --map-road: #4f6580; --map-ferry: #5f8fc4;
  --map-city: #c3cfdd; --map-off: #34465d; --halo: #182638;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 15px; line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.wrap {
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* Header: a motorway sign */
.top { padding-block: 14px 12px; }
.sign {
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  background: var(--sign-blue); color: var(--sign-blue-ink);
  border-radius: 8px; padding: 10px 16px;
  box-shadow: inset 0 0 0 2px var(--sign-blue), inset 0 0 0 4px rgba(255,255,255,.85);
}
.sign h1 {
  margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 28px;
  letter-spacing: .01em; line-height: 1.1; text-wrap: balance;
}
.sign .sub { font-size: 14px; opacity: .88; }
.sign .shield {
  font-family: var(--font-display); font-weight: 700; font-size: 18px;
  background: var(--sign-green); color: #fff; border: 2px solid #fff; border-radius: 4px; padding: 0 8px;
}

.layout {
  display: grid; grid-template-columns: minmax(320px, 420px) minmax(0, 1fr); gap: 16px;
  padding-block: 0 16px; align-items: start;
}
@media (max-width: 860px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  .col.left { display: contents; }
  .o1 { order: 1; } .o2 { order: 2; } .o3 { order: 3; } .o4 { order: 4; } .o5 { order: 5; }
}

.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); }
.col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }

/* Stops */
.stops { padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.stop { display: grid; grid-template-columns: 28px minmax(0, 1fr) 32px; gap: 8px; align-items: center; }
.marker {
  width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center;
  font-family: var(--font-display); font-weight: 700; font-size: 15px;
  background: var(--panel-2); border: 2px solid var(--map-city); color: var(--ink);
}
.stop.start .marker, .stop.end .marker { background: var(--accent); border-color: var(--accent); color: #1a1205; }
.combo { position: relative; min-width: 0; }
.combo input {
  width: 100%; height: 40px; border: 1px solid var(--line); border-radius: var(--radius);
  background: var(--panel-2); padding: 0 10px; font-size: 16px;
}
.combo input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.combo input.bad { border-color: var(--danger); }
.list {
  position: absolute; z-index: 30; left: 0; right: 0; top: calc(100% + 4px); margin: 0; padding: 4px;
  list-style: none; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  box-shadow: 0 10px 30px rgba(0,0,0,.18); max-height: 300px; overflow-y: auto;
}
.list li {
  display: flex; justify-content: space-between; gap: 10px; align-items: baseline;
  padding: 7px 8px; border-radius: 4px; cursor: pointer;
}
.list li[aria-selected="true"], .list li:hover { background: var(--accent-soft); }
.list .cc { font-family: var(--font-display); font-weight: 600; color: var(--muted); letter-spacing: .06em; }
.list .dlc { font-size: 12px; color: var(--muted); }
.list .off { opacity: .55; }
.iconbtn {
  width: 32px; height: 32px; border: 1px solid var(--line); border-radius: var(--radius);
  background: var(--panel); cursor: pointer; display: grid; place-items: center; color: var(--muted);
}
.iconbtn:hover { color: var(--ink); border-color: var(--muted); }
.row-actions { display: flex; gap: 8px; flex-wrap: wrap; padding-left: 36px; }
.btn {
  border: 1px solid var(--line); background: var(--panel); border-radius: var(--radius);
  padding: 6px 12px; cursor: pointer; font-weight: 500;
}
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #1a1205; font-weight: 600; }

/* Result */
.result { padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.label { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
.total { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.total .num {
  font-family: var(--font-display); font-weight: 700; font-size: 60px; line-height: 1;
  font-variant-numeric: tabular-nums; letter-spacing: -.01em;
}
.total .unit { font-family: var(--font-display); font-weight: 600; font-size: 24px; color: var(--muted); }
.route-name { font-family: var(--font-display); font-weight: 600; font-size: 20px; text-wrap: balance; }
.facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.fact { background: var(--panel-2); border-radius: var(--radius); padding: 8px 10px; min-width: 0; }
.fact b { display: block; font-family: var(--font-display); font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
.fact span { font-size: 12px; color: var(--muted); }
.note { font-size: 13px; color: var(--muted); }
.warn { font-size: 14px; color: var(--danger); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  font-family: var(--font-display); font-weight: 600; font-size: 13px; letter-spacing: .05em;
  border: 1px solid var(--line); border-radius: 4px; padding: 1px 7px; background: var(--panel-2);
}

/* Leg sheet */
.legs { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.legs td { padding: 7px 4px; border-top: 1px solid var(--line); vertical-align: top; }
.legs td.km, .legs td.sum { text-align: right; white-space: nowrap; }
.legs td.sum { color: var(--muted); }
.legs .city { font-weight: 600; }
.legs .stopname { font-family: var(--font-display); font-weight: 700; font-size: 17px; }
.badges { display: inline-flex; gap: 4px; flex-wrap: wrap; margin-left: 4px; vertical-align: 1px; }
.rb {
  font-family: var(--font-display); font-weight: 600; font-size: 12px; line-height: 1; padding: 3px 5px 2px;
  border-radius: 3px; color: #fff; background: var(--sign-blue); white-space: nowrap;
}
.rb.e { background: var(--sign-green); }
.rb.ferry { background: var(--map-ferry); }
.legs-wrap { overflow-x: auto; }

/* Map */
.mapbox { position: relative; overflow: hidden; height: calc(100vh - 110px); min-height: 420px; }
@media (max-width: 860px) { .mapbox { height: 62vh; min-height: 340px; } }
#map { display: block; width: 100%; height: 100%; background: var(--map-water); touch-action: none; cursor: grab; user-select: none; }
#map.drag { cursor: grabbing; }
#map .land { fill: var(--map-land); stroke: var(--map-border); stroke-width: 1; vector-effect: non-scaling-stroke; }
#map .edge { stroke: var(--map-road); stroke-width: 1.2; vector-effect: non-scaling-stroke; fill: none; }
#map .edge.ferry { stroke: var(--map-ferry); stroke-dasharray: 4 4; }
#map .edge.off { stroke: var(--map-off); }
#map .route { stroke: var(--accent); stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; fill: none; vector-effect: non-scaling-stroke; }
#map .route.ferry { stroke-dasharray: 2 9; stroke-width: 4; }
#map .dot { stroke: var(--map-city); stroke-width: 5; stroke-linecap: round; vector-effect: non-scaling-stroke; }
#map .dot.off { stroke: var(--map-off); }
#map .dot.on { stroke: var(--accent); stroke-width: 9; }
#map .hit { stroke: transparent; stroke-width: 22; stroke-linecap: round; vector-effect: non-scaling-stroke; cursor: pointer; }
#map text {
  font-family: var(--font-display); font-weight: 600; fill: var(--ink);
  paint-order: stroke; stroke: var(--halo); stroke-width: 3px; stroke-linejoin: round; pointer-events: none;
}
#map text.big { font-weight: 700; }
.mapctl { position: absolute; right: 10px; top: 10px; display: flex; flex-direction: column; gap: 6px; }
.mapctl button {
  width: 36px; height: 36px; border-radius: var(--radius); border: 1px solid var(--line);
  background: var(--panel); cursor: pointer; font-size: 18px; font-weight: 600; display: grid; place-items: center;
}
.legend {
  position: absolute; left: 10px; bottom: 10px; display: flex; gap: 12px; flex-wrap: wrap;
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 5px 10px; font-size: 12px; color: var(--muted);
  max-width: calc(100% - 20px);
}
.legend i { display: inline-block; width: 18px; height: 0; border-top: 3px solid var(--accent); vertical-align: middle; margin-right: 5px; }
.legend i.road { border-top: 2px solid var(--map-road); }
.legend i.ferry { border-top: 2px dashed var(--map-ferry); }
.pop {
  position: absolute; z-index: 20; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  box-shadow: 0 10px 30px rgba(0,0,0,.2); padding: 8px; display: flex; flex-direction: column; gap: 6px; min-width: 170px;
}
.pop .t { font-family: var(--font-display); font-weight: 700; font-size: 17px; }
.pop .d { font-size: 12px; color: var(--muted); margin-top: -4px; }

/* Settings */
details.panel > summary {
  cursor: pointer; padding: 12px 16px; font-family: var(--font-display); font-weight: 700; font-size: 18px; list-style: none;
  display: flex; justify-content: space-between; align-items: center;
}
details.panel > summary::-webkit-details-marker { display: none; }
details.panel > summary::after { content: "+"; color: var(--muted); font-size: 22px; }
details.panel[open] > summary::after { content: "–"; }
.settings { padding: 0 16px 16px; display: flex; flex-direction: column; gap: 14px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field label { font-size: 13px; color: var(--muted); }
.field input[type="number"] {
  height: 36px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel-2); padding: 0 8px; width: 100%;
  font-variant-numeric: tabular-nums;
}
.checks { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px 10px; }
.checks label { display: flex; gap: 8px; align-items: center; font-size: 14px; cursor: pointer; min-width: 0; }
.checks input { accent-color: var(--accent); width: 16px; height: 16px; flex: none; }
.calib { display: flex; gap: 8px; align-items: end; flex-wrap: wrap; }
.calib .field { flex: 1 1 140px; }
.about { padding: 0 16px 16px; font-size: 14px; color: var(--muted); display: flex; flex-direction: column; gap: 8px; max-width: 70ch; }
.about p { margin: 0; }
.about b { color: var(--ink); }
footer { padding-block: 4px 24px; font-size: 12px; color: var(--muted); }
@media (prefers-reduced-motion: no-preference) { .list li, .btn, .iconbtn { transition: background .12s, border-color .12s; } }
</style>
